name: Atlantis Chan

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
            
            - name: "Deploy via SSH"
              uses: appleboy/ssh-action@v1.0.3
              env:
                DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
              with:
                host: ${{ secrets.VPS_HOST }}
                username: ${{ secrets.VPS_USER }}
                key: ${{ secrets.SSH_PRIVATE_KEY }}
                envs: DISCORD_TOKEN
                script: |
                  set -e

                  if [ ! -d "$HOME/AtlantisChan/.git" ]; then
                    mkdir -p "$HOME/AtlantisChan"
                    git clone "https://github.com/${{ github.repository }}.git" "$HOME/AtlantisChan"
                  fi

                  cd "$HOME/AtlantisChan"
                  git pull origin main

                  umask 077
                  printf 'DISCORD_TOKEN=%s\n' "$DISCORD_TOKEN" > .env

                  if [ ! -x ".venv/bin/python" ]; then
                    rm -rf .venv
                    python3 -m venv .venv
                  fi

                  if ! .venv/bin/python -m pip --version >/dev/null 2>&1; then
                    .venv/bin/python -m ensurepip --upgrade
                  fi

                  .venv/bin/python -m pip install --upgrade discord.py python-dotenv

                  PM2="$HOME/.local/bin/pm2"
                  if [ ! -x "$PM2" ]; then
                    mkdir -p "$HOME/.local"
                    npm install --prefix "$HOME/.local" pm2
                  fi

                  "$PM2" delete atlantis-chan 2>/dev/null || true
                  "$PM2" start bot.py --name atlantis-chan --interpreter "$PWD/.venv/bin/python"
                  "$PM2" save